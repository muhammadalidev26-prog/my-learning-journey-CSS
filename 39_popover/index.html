<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popovers using CSS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="card">
    <div class="first-row">
      <button class="info-btn" popovertarget="more-info" aria-label="more info button">
        <i class="fa-solid fa-info"></i>
      </button>
      <h2>CSS Popover API</h2>
    </div>
    <dialog id="more-info" popover="manual">
      <div class="first-row">
        <h3>More Information</h3>
        <button popovertarget="more-info" popovertargetaction="hide"><i class="fa-solid fa-close"></i></button>
      </div>
      <p>The Popover API lets you create tooltips, dropdowns, and popups using native HTML without JavaScript</p>
    </dialog>
  </div>
</body>

</html>
