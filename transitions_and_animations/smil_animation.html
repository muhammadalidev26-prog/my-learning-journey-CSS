<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMIL animation</title>
  <link rel="stylesheet" href="css/smil_animation.css">
</head>

<body>

  <!-- We would animate SVG via HTML no CSS no Js just pure HTML  -->

  <svg width="400" viewBox="0 0 170 170">
    <circle cx="80" cy="80" r="20" opacity="0.15" fill="#00f5a0">
    <animate attributeName="r" values="20; 30; 20" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="80" r="15" fill="#00f5a0" opacity="0.8">
    <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  </svg>
  
  <svg width="400" height="150" viewBox="0 0 400 150">
    <circle cy="40" r="40" fill="#FF4500">
      <animate attributeName="cx" from="50" to="350" dur="2s" repeatCount="indefinite" />
    </circle>
  </svg>

  <svg width="200" height="200" viewBox="0 0 200 200">
  <circle cx="100" cy="70" fill="#008080">
    <!-- Animates the size -->
    <animate 
      attributeName="r" 
      values="30; 70; 30" 
      dur="3s" 
      repeatCount="indefinite" />
    <!-- Animates the color -->
    <animate 
      attributeName="fill" 
      values="#008080; #FFD700; #008080" 
      dur="3s" 
      repeatCount="indefinite" />
  </circle>
</svg>

</body>

</html>
