<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animations on Scroll</title>
  <link rel="stylesheet" href="css/scroll_animation.css">
</head>
<body>
  <section class="hero">
    <h1>SVG Scroll Animation</h1>
    <p>Scroll Down to see the animations 👇</p>
  </section>

  <section class="svg-section">
    <svg viewBox="0 0 200 200">
      <circle cx="50" cy="100" r="20" />
      <rect x="75" y="50" width="40" height="40" />
      <rect class="square" x="140" y="80" width="40" height="40" />
    </svg>
  </section>

  <section class="end">
    <h2>Animation Complete 🚀</h2>
  </section>
</body>
</html>
